    { id: 41, topic: "3", type: "Определение", question: "Как различаются селекция и проекция реляционной алгебры?", options: ["Обе операции определяют только порядок строк", "Селекция выбирает столбцы, проекция — строки", "Обе операции только объединяют два отношения", "Селекция выбирает строки, проекция — атрибуты", "Селекция удаляет таблицу, проекция создаёт индекс"], correct: 3, explanation: "WHERE соответствует выбору строк, список SELECT — выбору атрибутов.", source: "Лекция 3, с. 7" },

    { id: 45, topic: "4", type: "Теория", question: "Для чего служит ON в JOIN students s JOIN groups g ON s.group_id = g.group_id?", options: ["Создаёт постоянный внешний ключ", "Указывает направление сортировки", "Задаёт условие соответствия строк двух таблиц", "Переименовывает исходные столбцы", "Определяет среднее значение"], correct: 2, explanation: "ON описывает, какие строки связываются в результате запроса.", source: "Лекция 4, с. 3–4" },

    { id: 49, topic: "4", type: "Теория", question: "Как переписать A RIGHT JOIN B ON A.id = B.a_id, сохранив смысл соединения?", options: ["B LEFT JOIN A ON A.id = B.a_id", "A INNER JOIN B ON A.id = B.a_id", "B INNER JOIN A ON A.id = B.a_id", "A LEFT JOIN B ON A.id = B.a_id", "A FULL JOIN B ON A.id = B.a_id"], correct: 0, explanation: "Нужно поменять стороны местами и использовать LEFT JOIN.", source: "Лекция 4, с. 4" },

  const container = document.getElementById('questionsContainer');

  function renderQuestions() {
    container.innerHTML = '';

      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `q-${idx}`;

      // Заголовок
      const header = document.createElement('div');
      header.className = 'question-header';
      header.innerHTML = `

            `;

      // Текст
      const qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = q.question;
      card.appendChild(qText);

      // Варианты
      const optionsDiv = document.createElement('div');
      optionsDiv.className = 'options';
      q.options.forEach((opt, optIdx) => {
        const optDiv = document.createElement('div');
        optDiv.className = 'option';
        if (userAnswers[idx] === optIdx) optDiv.classList.add('selected');

        const radio = document.createElement('input');
        radio.type = 'radio';
        radio.name = `q${idx}`;
        radio.value = optIdx;
        radio.checked = userAnswers[idx] === optIdx;
        radio.id = `q${idx}_opt${optIdx}`;

        const label = document.createElement('label');
        label.htmlFor = `q${idx}_opt${optIdx}`;
        label.textContent = opt;

        radio.addEventListener('change', (e) => {
          userAnswers[idx] = parseInt(e.target.value);
          updateCardSelection(idx);
          updateStats();
        });

        optDiv.appendChild(radio);
        optDiv.appendChild(label);
        optionsDiv.appendChild(optDiv);
      });
      card.appendChild(optionsDiv);

      // Пояснение
      const expDiv = document.createElement('div');
      expDiv.className = 'explanation';
      expDiv.id = `exp-${idx}`;
      expDiv.innerHTML = `<strong>Пояснение:</strong> ${q.explanation}<div class="source">${q.source}</div>`;
      card.appendChild(expDiv);

      // Результат
      const resDiv = document.createElement('div');
      resDiv.className = 'result-bar';
      resDiv.id = `res-${idx}`;
      card.appendChild(resDiv);

      container.appendChild(card);
    });
    updateStats();
    if (checked) applyCheckVisuals();
    if (showExplanations) document.querySelectorAll('.explanation').forEach(el => el.classList.add('show'));
  }

  function updateCardSelection(idx) {
    const card = document.getElementById(`q-${idx}`);
    const options = card.querySelectorAll('.option');
    options.forEach((opt, optIdx) => {
      opt.classList.toggle('selected', userAnswers[idx] === optIdx);
    });
    // Сброс визуальной проверки, если ответ изменился
    if (checked) {
      card.classList.remove('correct', 'incorrect');
      document.getElementById(`res-${idx}`).innerHTML = '';
      // Убираем старые метки правильности
      options.forEach(opt => opt.classList.remove('correct-answer', 'wrong-answer'));
    }
  }

  function applyCheckVisuals() {
    let correctCount = 0;
    let incorrectCount = 0;
    questionsData.forEach((q, idx) => {
      const card = document.getElementById(`q-${idx}`);
      const options = card.querySelectorAll('.option');
      const resDiv = document.getElementById(`res-${idx}`);
      const selected = userAnswers[idx];

      // Убираем старые классы
      card.classList.remove('correct', 'incorrect');
      options.forEach(opt => opt.classList.remove('correct-answer', 'wrong-answer'));

      if (selected === null) {
        resDiv.innerHTML = '<span style="color:#64748b;">⏳ Нет ответа</span>';
        return;
      }

      const isCorrect = selected === q.correct;
      if (isCorrect) {
        card.classList.add('correct');
        options[selected].classList.add('correct-answer');
        resDiv.innerHTML = '<span class="correct-mark">✅ Верно</span>';
        correctCount++;
      } else {
        card.classList.add('incorrect');
        options[selected].classList.add('wrong-answer');
        options[q.correct].classList.add('correct-answer');
        resDiv.innerHTML = `<span class="incorrect-mark">❌ Ошибка. Правильный ответ: ${q.options[q.correct]}</span>`;
        incorrectCount++;
      }
    });
    // Обновляем глобальную статистику
    document.getElementById('correctCount').textContent = correctCount;
    document.getElementById('incorrectCount').textContent = incorrectCount;
    document.getElementById('scoreDisplay').textContent = `${correctCount} / 100`;
  }

  function updateStats() {
    const answered = userAnswers.filter(a => a !== null).length;
    document.getElementById('answeredCount').textContent = answered;
    document.getElementById('progressText').textContent = `${answered} из 100 answered`;
    if (!checked) {
      // Обновляем счётчик правильных/неправильных только если не проверено
      let correct = 0, incorrect = 0;
      userAnswers.forEach((ans, idx) => {
        if (ans !== null) {
          if (ans === questionsData[idx].correct) correct++;
          else incorrect++;
        }
      });
      document.getElementById('correctCount').textContent = correct;
      document.getElementById('incorrectCount').textContent = incorrect;
      document.getElementById('scoreDisplay').textContent = `${correct} / 100`;
    }
  }

  // ======================== ДЕЙСТВИЯ ========================
  function checkAll() {
    checked = true;
    applyCheckVisuals();
  }

  function resetAll() {
    userAnswers.fill(null);
    checked = false;
    showExplanations = false;
    document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
    document.querySelectorAll('.option').forEach(o => o.classList.remove('selected', 'correct-answer', 'wrong-answer'));
    document.querySelectorAll('.question-card').forEach(c => c.classList.remove('correct', 'incorrect'));
    document.querySelectorAll('.result-bar').forEach(r => r.innerHTML = '');
    document.querySelectorAll('.explanation').forEach(e => e.classList.remove('show'));
    document.getElementById('toggleExplainBtn').textContent = 'Показать пояснения';
    updateStats();
    document.getElementById('correctCount').textContent = '0';
    document.getElementById('incorrectCount').textContent = '0';
    document.getElementById('scoreDisplay').textContent = '0 / 100';
    document.getElementById('answeredCount').textContent = '0';
  }

  function toggleExplanations() {
    showExplanations = !showExplanations;
    document.querySelectorAll('.explanation').forEach(el => el.classList.toggle('show', showExplanations));
    document.getElementById('toggleExplainBtn').textContent = showExplanations ? 'Скрыть пояснения' : 'Показать пояснения';
  }

  // ======================== ИНИЦИАЛИЗАЦИЯ ========================
  document.addEventListener('DOMContentLoaded', () => {
    renderQuestions();

    document.getElementById('checkBtn').addEventListener('click', checkAll);
    document.getElementById('checkBtn2').addEventListener('click', checkAll);
    document.getElementById('resetBtn').addEventListener('click', resetAll);
    document.getElementById('toggleExplainBtn').addEventListener('click', toggleExplanations);
    document.getElementById('scrollTopBtn').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  });
</script>
</body>
